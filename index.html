<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alice Croft Artist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #faf8f2; 
      color: #1f3d2c;
      position: relative; /* needed for background layer */
    }

    /* Background image with ~30% opacity */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("field.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.2;          /* 30% opacity */
      z-index: -1;           /* behind all content */
      pointer-events: none;  /* don’t block clicks */
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }

    header img {
      width: 100%;
      max-width: 600px;  
      height: auto;
      display: block;
      margin: 0 auto;
    }

    nav {
      text-align: center;
      margin-top: 1rem;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #1f3d2c;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      padding-bottom: 4px;
    }

    nav a:hover {
      border-bottom: 3px solid #e8c84a;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo.png" alt="Alice Croft Artist Logo">
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="available-work.html">Available Work</a>
    <a href="process.html">Process</a>
    <a href="workshops.html">Workshops</a>
    <a href="contact.html">Contact</a>
  </nav>

  <footer>© 2026 Alice Croft Artist</footer>

</body>
</html>
